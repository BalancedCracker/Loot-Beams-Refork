modLoader = "javafml"
loaderVersion = "[2,)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    description = '''${mod_description}'''
    authors = "${mod_author}"
    # Path relative to the jar root. This is what mod lists and launchers show as the icon;
    # the Fabric equivalent is the "icon" field in fabric.mod.json.
    logoFile = "assets/${mod_id}/${mod_id}.png"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47.3.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
versionRange = "${target_minecraft}"
mandatory = true

${nirvana_depends}